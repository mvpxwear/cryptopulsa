<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order — CryptoPulsa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    .container {
      width: min(500px, calc(100% - 24px));
      margin: auto;
    }

    header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
    }

    .logo span {
      color: #2563eb;
    }

    main {
      padding: 22px 0 50px;
    }

    .card {
      background: white;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      padding: 22px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .status {
      text-align: center;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .status-icon {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .status strong {
      display: block;
      font-size: 16px;
    }

    .order-code {
      text-align: center;
      background: #f8fafc;
      padding: 15px;
      border-radius: 13px;
      margin-bottom: 18px;
    }

    .order-code small {
      display: block;
      color: #64748b;
      margin-bottom: 5px;
    }

    .order-code strong {
      font-size: 20px;
      letter-spacing: .5px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    .row span {
      color: #64748b;
    }

    .row strong {
      text-align: right;
    }

    .payment-box {
      margin-top: 22px;
      padding: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
    }

    .payment-box h2 {
      font-size: 17px;
      margin-bottom: 6px;
    }

    .payment-description {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .payment-address {
      background: white;
      border: 1px dashed #cbd5e1;
      padding: 13px;
      border-radius: 11px;
      word-break: break-all;
      font-size: 13px;
      font-weight: 700;
    }

    .copy-button {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 11px;
      border-radius: 10px;
      margin-top: 9px;
      font-weight: 700;
    }

    .amount {
      font-size: 22px;
      font-weight: 900;
      margin: 12px 0;
    }

    .network {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .network-option {
      display: block;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      cursor: pointer;
    }

    .network-option:hover {
      border-color: #2563eb;
    }

    .network-option input {
      width: auto;
      margin-right: 8px;
    }

    .network-name {
      font-weight: 800;
      font-size: 14px;
    }

    .network-minimum {
      color: #64748b;
      font-size: 12px;
      margin-top: 5px;
      margin-left: 24px;
    }

    .form-group {
      margin-top: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #dbe1e8;
      border-radius: 11px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    .pay-button {
      width: 100%;
      border: 0;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 900;
      margin-top: 18px;
      cursor: pointer;
    }

    .pay-button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .secondary-button {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 12px;
      border-radius: 11px;
      font-weight: 800;
      margin-top: 10px;
      cursor: pointer;
    }

    .message {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 15px;
      border-radius: 13px;
      text-align: center;
    }

    .warning {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 13px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">
      Crypto<span>Pulsa</span>
    </div>
  </div>
</header>

<main>

  <div class="container">

    <div id="content" class="card">
      <div style="text-align:center">
        Memuat pesanan...
      </div>
    </div>

  </div>

</main>

<script type="module">

import {
  createClient
} from 'https://esm.sh/@supabase/supabase-js@2';


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  'https://yteecjibmanhdxkdseod.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_x4MDLBw3OBSS2HnyB2ssKg_UfWOS_H4';


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const content =
  document.getElementById('content');


let currentOrder = null;
let paymentSettings = [];


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeJS(value) {

  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');

}


function formatIDR(value) {

  return new Intl.NumberFormat(
    'id-ID',
    {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }
  ).format(
    Number(value || 0)
  );

}


function getOrderCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get('order');

}


/* =========================
   LOAD PAYMENT SETTINGS
========================= */

async function loadPaymentSettings() {

  const functionUrl =
    SUPABASE_URL +
    '/functions/v1/payment-settings';


  const response =
    await fetch(
      functionUrl,
      {
        method: 'GET'
      }
    );


  if (!response.ok) {

    throw new Error(
      'Gagal mengambil payment settings.'
    );

  }


  const result =
    await response.json();


  if (
    !result.success ||
    !Array.isArray(result.data)
  ) {

    throw new Error(
      'Payment settings tidak tersedia.'
    );

  }


  paymentSettings =
    result.data.filter(
      item =>
        item.active === true
    );

}


/* =========================
   LOAD ORDER
========================= */

async function loadOrder() {

  const orderCode =
    getOrderCode();


  if (!orderCode) {

    content.innerHTML = `
      <div class="error">
        Order ID tidak ditemukan.
      </div>
    `;

    return;

  }


  try {

    const {
      data,
      error
    } = await supabase
      .from('orders')
      .select(`
        order_code,
        customer_contact,
        destination,
        quantity,
        price_idr,
        price_usd,
        payment_method,
        payment_status,
        order_status,
        created_at,

        products (
          name
        ),

        product_variants (
          name,
          nominal
        )
      `)
      .eq(
        'order_code',
        orderCode
      )
      .single();


    if (error) {

      throw error;

    }


    if (!data) {

      throw new Error(
        'Pesanan tidak ditemukan.'
      );

    }


    currentOrder =
      data;


    await loadPaymentSettings();


    renderOrder();


  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error">
        Gagal memuat pesanan.
        <br><br>
        <small>
          ${escapeHTML(
            error.message
          )}
        </small>
      </div>
    `;

  }

}


/* =========================
   RENDER ORDER
========================= */

function renderOrder() {

  const data =
    currentOrder;


  const productName =
    data.products
      ? data.products.name
      : '-';


  let statusText =
    'Menunggu pembayaran';

  let statusIcon =
    '💳';


  if (
    data.payment_status === 'paid'
  ) {

    statusText =
      'Pembayaran diterima';

    statusIcon =
      '✅';

  }


  if (
    data.order_status === 'processing'
  ) {

    statusText =
      'Pesanan sedang diproses';

    statusIcon =
      '⚙️';

  }


  if (
    data.order_status === 'completed'
  ) {

    statusText =
      'Pesanan selesai';

    statusIcon =
      '🎉';

  }


  content.innerHTML = `

    <h1>
      Detail Pesanan
    </h1>

    <div class="subtitle">
      Pantau status pesanan kamu di sini.
    </div>


    <div class="status">

      <div class="status-icon">
        ${statusIcon}
      </div>

      <strong>
        ${statusText}
      </strong>

    </div>


    <div class="order-code">

      <small>
        Order ID
      </small>

      <strong>
        ${escapeHTML(
          data.order_code
        )}
      </strong>

    </div>


    <div class="row">
      <span>Produk</span>

      <strong>
        ${escapeHTML(
          productName
        )}
      </strong>
    </div>


    <div class="row">
      <span>Tujuan</span>

      <strong>
        ${escapeHTML(
          data.destination
        )}
      </strong>
    </div>


    <div class="row">
      <span>Jumlah</span>

      <strong>
        ${escapeHTML(
          data.quantity
        )}
      </strong>
    </div>


    <div class="row">
      <span>Harga</span>

      <strong>
        ${formatIDR(
          data.price_idr
        )}
      </strong>
    </div>


    <div class="row">
      <span>USD</span>

      <strong>
        ${
          data.price_usd
            ? '$' +
              Number(
                data.price_usd
              ).toFixed(2)
            : '-'
        }
      </strong>
    </div>


    <div class="row">
      <span>Pembayaran</span>

      <strong>
        ${escapeHTML(
          data.payment_method
        )}
      </strong>
    </div>


    ${
      data.payment_status === 'pending'
        ? renderPaymentBox()
        : ''
    }

  `;

}


/* =========================
   PAYMENT BOX
========================= */

function renderPaymentBox() {

  if (
    !paymentSettings ||
    paymentSettings.length === 0
  ) {

    return `
      <div class="payment-box">

        <strong>
          Metode pembayaran belum tersedia.
        </strong>

      </div>
    `;

  }


  const method =
    String(
      currentOrder.payment_method || ''
    ).toLowerCase();


  if (
    method === 'paypal'
  ) {

    const setting =
      paymentSettings.find(
        item =>
          String(
            item.payment_method
          ).toLowerCase() ===
          'paypal'
      );


    if (!setting) {

      return `
        <div class="payment-box">
          PayPal tidak tersedia.
        </div>
      `;

    }


    return renderPayPal(
      setting
    );

  }


  if (
    method === 'crypto'
  ) {

    const cryptoSettings =
      paymentSettings.filter(
        item =>
          String(
            item.payment_method
          ).toLowerCase() ===
          'crypto' &&
          String(
            item.currency
          ).toUpperCase() ===
          'USDT' &&
          item.active === true
      );


    if (
      cryptoSettings.length === 0
    ) {

      return `
        <div class="payment-box">
          USDT tidak tersedia.
        </div>
      `;

    }


    return renderCryptoNetworks(
      cryptoSettings
    );

  }


  return `
    <div class="payment-box">
      Metode pembayaran tidak dikenali.
    </div>
  `;

}


/* =========================
   PAYPAL
========================= */

function renderPayPal(setting) {

  const amount =
    Number(
      currentOrder.price_usd || 0
    ).toFixed(2);


  return `

    <div class="payment-box">

      <h2>
        💳 Bayar dengan PayPal
      </h2>


      <div class="payment-description">

        Kirim pembayaran sesuai jumlah
        di bawah ke alamat PayPal CryptoPulsa.

      </div>


      <div class="amount">
        $${amount} USD
      </div>


      <div class="payment-description">
        Alamat PayPal:
      </div>


      <div class="payment-address">
        ${escapeHTML(
          setting.payment_address
        )}
      </div>


      <button
        class="copy-button"
        onclick="copyAddress(
          '${escapeJS(
            setting.payment_address
          )}'
        )"
      >
        📋 Salin Alamat PayPal
      </button>


      <div class="form-group">

        <label>
          PayPal Transaction ID
        </label>

        <input
          id="transactionId"
          type="text"
          placeholder="Masukkan Transaction ID"
          autocomplete="off"
        >

      </div>


      <button
        id="submitPaymentButton"
        class="pay-button"
        onclick="submitPaymentProof()"
      >
        SAYA SUDAH BAYAR
      </button>


      <div class="message">

        Setelah pembayaran, masukkan
        Transaction ID PayPal untuk
        proses verifikasi.

      </div>


      <div id="paymentResult"></div>

    </div>

  `;

}


/* =========================
   CRYPTO NETWORK SELECTOR
========================= */

function renderCryptoNetworks(
  settings
) {

  const options =
    settings.map(
      (setting, index) => {

        const network =
          escapeHTML(
            setting.network
          );


        const minimum =
          Number(
            setting.minimum_amount || 0
          );


        return `

          <label
            class="network-option"
          >

            <input
              type="radio"
              name="cryptoNetwork"
              value="${escapeHTML(
                setting.id
              )}"
              ${index === 0
                ? 'checked'
                : ''}
            >

            <span class="network-name">
              USDT ${network}
            </span>

            <div class="network-minimum">
              Minimum:
              ${minimum}
              USDT
            </div>

          </label>

        `;

      }
    )
    .join('');


  return `

    <div class="payment-box">

      <h2>
        ₿ Bayar dengan USDT
      </h2>


      <div class="payment-description">

        Pilih network yang tersedia.
        Pastikan network saat mengirim
        sama dengan network yang dipilih.

      </div>


      ${options}


      <button
        class="pay-button"
        onclick="selectCryptoNetwork()"
      >
        LANJUTKAN PEMBAYARAN
      </button>


      <div
        id="cryptoPaymentDetails"
      ></div>


      <div class="warning">

        ⚠️ Jangan mengirim USDT melalui
        network yang berbeda dari pilihan
        di atas. Kesalahan network dapat
        menyebabkan dana tidak masuk.

      </div>

    </div>

  `;

}


/* =========================
   SELECT CRYPTO NETWORK
========================= */

window.selectCryptoNetwork =
function() {

  const selected =
    document.querySelector(
      'input[name="cryptoNetwork"]:checked'
    );


  if (!selected) {

    alert(
      'Pilih network USDT terlebih dahulu.'
    );

    return;

  }


  const setting =
    paymentSettings.find(
      item =>
        String(item.id) ===
        String(selected.value)
    );


  if (!setting) {

    alert(
      'Network tidak tersedia.'
    );

    return;

  }


  const amount =
    Number(
      currentOrder.price_usd || 0
    ).toFixed(2);


  const minimum =
    Number(
      setting.minimum_amount || 0
    );


  const details =
    document.getElementById(
      'cryptoPaymentDetails'
    );


  details.innerHTML = `

    <div
      style="
        margin-top:18px;
        padding-top:18px;
        border-top:1px solid #e2e8f0;
      "
    >

      <div class="network">

        Network:
        ${escapeHTML(
          setting.network
        )}

      </div>


      <div class="payment-description">
        Jumlah pembayaran:
      </div>


      <div class="amount">
        ${amount} USDT
      </div>


      <div class="payment-description">
        Minimum:
        ${minimum} USDT
      </div>


      <div class="payment-description">
        Wallet penerima:
      </div>


      <div class="payment-address">

        ${escapeHTML(
          setting.payment_address
        )}

      </div>


      <button
        class="copy-button"
        onclick="copyAddress(
          '${escapeJS(
            setting.payment_address
          )}'
        )"
      >
        📋 Salin Wallet
      </button>


      <div class="form-group">

        <label>
          Transaction Hash
        </label>

        <input
          id="transactionId"
          type="text"
          placeholder="Masukkan TX Hash"
          autocomplete="off"
        >

      </div>


      <button
        id="submitPaymentButton"
        class="pay-button"
        onclick="submitPaymentProof(
          '${escapeJS(
            setting.network
          )}'
        )"
      >
        SAYA SUDAH BAYAR
      </button>


      <div class="message">

        Setelah pembayaran, masukkan
        Transaction Hash untuk proses
        verifikasi.

      </div>


      <div id="paymentResult"></div>

    </div>

  `;

};


/* =========================
   COPY ADDRESS
========================= */

window.copyAddress =
async function(address) {

  try {

    await navigator.clipboard
      .writeText(address);

    alert(
      'Alamat berhasil disalin.'
    );

  } catch {

    alert(
      'Gagal menyalin alamat.'
    );

  }

};


/* =========================
   SUBMIT PAYMENT PROOF
========================= */

window.submitPaymentProof =
async function(network = null) {

  const input =
    document.getElementById(
      'transactionId'
    );


  const result =
    document.getElementById(
      'paymentResult'
    );


  const button =
    document.getElementById(
      'submitPaymentButton'
    );


  if (
    !input ||
    !input.value.trim()
  ) {

    alert(
      'Masukkan Transaction ID / TX Hash.'
    );

    return;

  }


  const paymentReference =
    input.value.trim();


  if (button) {

    button.disabled = true;

    button.textContent =
      'MEMPROSES...';

  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        '/functions/v1/verify-payment',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            order_code:
              currentOrder.order_code,

            payment_reference:
              paymentReference,

            network:
              network
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        'Gagal memproses pembayaran.'
      );

    }


    if (
      data.status ===
      'already_paid'
    ) {

      result.innerHTML = `

        <div class="success">

          ✅ Pesanan ini sudah
          dinyatakan dibayar.

        </div>

      `;

      return;

    }


    result.innerHTML = `

      <div class="success">

        ✅ Bukti pembayaran diterima.

        <br><br>

        Reference:

        <strong>
          ${escapeHTML(
            paymentReference
          )}
        </strong>

        <br><br>

        Status:

        <strong>
          Menunggu verifikasi
        </strong>

      </div>

    `;


  } catch (error) {

    console.error(error);


    result.innerHTML = `

      <div class="error">

        ❌ Gagal mengirim bukti pembayaran.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;


  } finally {

    if (button) {

      button.disabled = false;

      button.textContent =
        'SAYA SUDAH BAYAR';

    }

  }

};


/* =========================
   START
========================= */

loadOrder();

</script>

</body>
</html>
