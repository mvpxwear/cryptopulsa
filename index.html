<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoPulsa</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      padding:20px;
    }

    .card{
      background:#1e293b;
      padding:16px;
      border-radius:12px;
      margin-top:20px;
    }

    pre{
      white-space:pre-wrap;
      word-break:break-word;
    }
  </style>
</head>
<body>

  <h1>🚀 CryptoPulsa</h1>
  <p>Pulsa & Saldo Digital Otomatis 24 Jam</p>

  <div class="card">
    <h3>Status</h3>
    <div id="status">Menghubungkan ke Supabase...</div>
  </div>

  <div class="card">
    <h3>Produk</h3>
    <div id="products">Memuat...</div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://yteecjibmanhdxkdseod.supabase.co',
      'sb_publishable_x4MDLBw3OBSS2HnyB2ssKg_UfWOS_H4'
    );

    document.getElementById('status').innerHTML =
      '✅ Supabase JS berhasil dimuat';

    async function loadProducts() {

      const status = document.getElementById('status');
      const products = document.getElementById('products');

      try {

        const { data, error } = await supabase
          .from('products')
          .select('*');

        if (error) {
          status.innerHTML = '❌ Query gagal';
          products.innerHTML =
            '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
          return;
        }

        status.innerHTML = '✅ Berhasil terhubung ke Supabase';

        if (!data || data.length === 0) {
          products.innerHTML =
            '⚠️ Tidak ada produk di database';
          return;
        }

        products.innerHTML =
          '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

      } catch (e) {

        status.innerHTML = '❌ Error JavaScript';

        products.innerHTML =
          '<pre>' + e.message + '</pre>';

      }
    }

    loadProducts();
  </script>

</body>
</html>
